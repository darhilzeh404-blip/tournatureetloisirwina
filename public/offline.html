<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b6cd6" />
    <title>Hors ligne — Tour Wina</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --primary: #3b6cd6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        display: inline-block;
        object-fit: contain;
        background: #fff;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px -10px rgba(59, 108, 214, 0.5);
      }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
      p { color: var(--muted); margin: 0 0 24px; font-size: 15px; line-height: 1.5; }
      button {
        background: var(--primary);
        color: #fff;
        border: 0;
        padding: 12px 22px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { background: #2d4ea8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <img class="badge" src="/icon-192.png" alt="Wina Tour" width="72" height="72" />
        <h1>Vous êtes hors ligne</h1>
        <p>Vérifiez votre connexion internet et réessayez. Vos réservations restent en sécurité.</p>
        <button onclick="location.reload()">Réessayer</button>
      </div>
    </div>
  </body>
</html>
