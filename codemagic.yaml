workflows:
  ios-wina-tour:
    name: WINA TOUR iOS
    instance_type: mac_mini_m2

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - ios/App/build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  android-wina-tour:
    name: WINA TOUR Android
    instance_type: linux_x2

    environment:
      node: 22
      groups:
        # Create this group in Codemagic > Teams > Environment variables, with:
        #   CM_KEYSTORE            - base64 of your .keystore/.jks file (encrypted)
        #   CM_KEYSTORE_PASSWORD   - keystore password (encrypted)
        #   CM_KEY_ALIAS           - key alias (encrypted)
        #   CM_KEY_PASSWORD        - key password (encrypted)
        - android_signing

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Write keystore from encrypted variable
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/wina-tour-release.keystore
          cat > $CM_BUILD_DIR/android/keystore.properties <<EOF
          storeFile=../wina-tour-release.keystore
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Build Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
